<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamCart — Live Shopping</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <span class="logo">🛒 StreamCart</span>
  <div class="nav-links" id="nav-links"></div>
</nav>

<div class="page-wrap">

  <!-- Hero -->
  <div style="text-align:center; padding: 2.5rem 0 2rem;">
    <h1 style="font-size:2rem; font-weight:700; margin-bottom:.5rem">
      Shop Live. Buy Now.
    </h1>
    <p style="color:var(--muted); font-size:1rem; margin-bottom:1.5rem">
      Watch sellers showcase products in real-time and grab flash deals before they're gone.
    </p>
    <div id="hero-btn"></div>
  </div>

  <!-- Filter tabs -->
  <div style="display:flex; gap:8px; margin-bottom:1.25rem;">
    <button class="btn btn-primary btn-sm" onclick="loadStreams()">All</button>
    <button class="btn btn-outline btn-sm" onclick="loadStreams('live')">🔴 Live now</button>
    <button class="btn btn-outline btn-sm" onclick="loadStreams('scheduled')">📅 Upcoming</button>
    <button class="btn btn-outline btn-sm" onclick="loadStreams('ended')">📼 Past streams</button>
  </div>

  <!-- Stream grid -->
  <div class="grid-3" id="streams-grid">
    <p style="color:var(--muted)">Loading streams...</p>
  </div>
</div>

<script src="app.js"></script>
<script>
  // ── NAVBAR ──────────────────────────────────────────────────
  function renderNav() {
    const nav  = document.getElementById('nav-links');
    const user = Auth.user();

    if (user) {
      nav.innerHTML = `
        <span style="font-size:13px;color:var(--muted)">Hi, ${user.name}</span>
        ${user.role === 'seller'
          ? '<a href="dashboard.html" class="btn btn-primary btn-sm">Dashboard</a>'
          : ''}
        <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
      `;
    } else {
      nav.innerHTML = `
        <a href="#" onclick="showAuth('login')"  class="btn btn-outline  btn-sm">Login</a>
        <a href="#" onclick="showAuth('register')" class="btn btn-primary btn-sm">Sign up</a>
      `;
    }

    const heroBtn = document.getElementById('hero-btn');
    if (!user) {
      heroBtn.innerHTML = `<button class="btn btn-primary" onclick="showAuth('register')">Get started free</button>`;
    } else if (user.role === 'seller') {
      heroBtn.innerHTML = `<a href="dashboard.html" class="btn btn-primary">Go to dashboard →</a>`;
    } else {
      heroBtn.innerHTML = `<button class="btn btn-primary" onclick="loadStreams('live')">Watch live streams</button>`;
    }
  }

  // ── LOAD STREAMS VIA GRAPHQL ────────────────────────────────
  async function loadStreams(status = null) {
    const grid = document.getElementById('streams-grid');
    grid.innerHTML = '<p style="color:var(--muted)">Loading...</p>';

    try {
      const data = await gql(`
        query GetStreams($status: String) {
          streams(status: $status) {
            id title description status createdAt
            seller { name }
            products { id name price stock_quantity }
          }
        }
      `, { status });

      const streams = data.streams;
      if (!streams.length) {
        grid.innerHTML = '<p style="color:var(--muted)">No streams found.</p>';
        return;
      }

      grid.innerHTML = streams.map(s => `
        <div class="card stream-card" onclick="window.location='stream.html?id=${s.id}'">
          <div class="thumb">📡</div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
            <h3>${s.title}</h3>
            <span class="badge badge-${s.status}">${s.status === 'live' ? '🔴 LIVE' : s.status}</span>
          </div>
          <div class="meta">
            <span>by ${s.seller.name}</span>
            <span>·</span>
            <span>${s.products.length} products</span>
            <span>·</span>
            <span>${timeAgo(s.createdAt)}</span>
          </div>
          ${s.description ? `<p style="font-size:13px;color:var(--muted);margin-top:6px">${s.description}</p>` : ''}
        </div>
      `).join('');

    } catch (err) {
      grid.innerHTML = `<p style="color:var(--red)">${err.message}</p>`;
    }
  }

  // ── AUTH MODAL ───────────────────────────────────────────────
  function showAuth(mode) {
    const existing = document.getElementById('auth-modal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'auth-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000';

    modal.innerHTML = `
      <div class="card" style="width:100%;max-width:400px;padding:2rem">
        <h2 style="margin-bottom:1.25rem;font-size:1.25rem">${mode === 'login' ? 'Login' : 'Create account'}</h2>
        ${mode === 'register' ? `
          <div class="form-group">
            <label>Name</label>
            <input id="auth-name" placeholder="Your name">
          </div>` : ''}
        <div class="form-group">
          <label>Email</label>
          <input id="auth-email" type="email" placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="auth-password" type="password" placeholder="••••••••">
        </div>
        ${mode === 'register' ? `
          <div class="form-group">
            <label>I want to</label>
            <select id="auth-role">
              <option value="buyer">Buy products</option>
              <option value="seller">Sell products (seller)</option>
            </select>
          </div>` : ''}
        <button class="btn btn-primary" style="width:100%;margin-bottom:.75rem" onclick="submitAuth('${mode}')">
          ${mode === 'login' ? 'Login' : 'Create account'}
        </button>
        <p style="text-align:center;font-size:13px;color:var(--muted)">
          ${mode === 'login'
            ? `No account? <a href="#" onclick="showAuth('register')">Sign up</a>`
            : `Have an account? <a href="#" onclick="showAuth('login')">Login</a>`}
        </p>
        <button onclick="document.getElementById('auth-modal').remove()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)">×</button>
      </div>
    `;
    modal.style.position = 'fixed';
    document.body.appendChild(modal);
  }

  async function submitAuth(mode) {
    try {
      let result;
      if (mode === 'login') {
        result = await gql(`
          mutation Login($email: String!, $password: String!) {
            login(email: $email, password: $password) { token user { id name email role } }
          }
        `, {
          email:    document.getElementById('auth-email').value,
          password: document.getElementById('auth-password').value,
        });
        result = result.login;
      } else {
        result = await gql(`
          mutation Register($name:String!,$email:String!,$password:String!,$role:String) {
            register(name:$name,email:$email,password:$password,role:$role) { token user { id name email role } }
          }
        `, {
          name:     document.getElementById('auth-name').value,
          email:    document.getElementById('auth-email').value,
          password: document.getElementById('auth-password').value,
          role:     document.getElementById('auth-role')?.value || 'buyer',
        });
        result = result.register;
      }

      Auth.save(result.token, result.user);
      document.getElementById('auth-modal').remove();
      toast(`Welcome, ${result.user.name}!`, 'success');
      renderNav();

      if (result.user.role === 'seller') {
        setTimeout(() => window.location = 'dashboard.html', 800);
      }

    } catch (err) {
      toast(err.message, 'error');
    }
  }

  function logout() {
    Auth.clear();
    renderNav();
    toast('Logged out', 'info');
    loadStreams();
  }

  // ── INIT ─────────────────────────────────────────────────────
  renderNav();
  loadStreams();
</script>
</body>
</html>
