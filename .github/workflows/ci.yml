# ─────────────────────────────────────────────────────────────
# StreamCart CI Pipeline
# Runs on every push to any branch and every pull request to dev/main
# ─────────────────────────────────────────────────────────────

name: CI — Test and Type Check

on:
  push:
    branches: ['**']        # every branch
  pull_request:
    branches: [dev, main]   # PRs targeting dev or main

jobs:

  # ── JOB 1: TYPE CHECK ────────────────────────────────────────
  # Runs TypeScript compiler — catches type errors before runtime
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest

    steps:
      # Step 1 — checkout the code that was just pushed
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — set up Node.js
      # actions/setup-node is an official GitHub Action
      # It installs the specified Node version on the runner
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'        # cache node_modules between runs — faster

      # Step 3 — install dependencies
      - name: Install dependencies
        run: npm ci
        # npm ci is stricter than npm install:
        # - reads package-lock.json exactly (reproducible)
        # - deletes node_modules first (clean install)
        # - never modifies package-lock.json
        # Always use npm ci in CI pipelines, not npm install

      # Step 4 — run TypeScript compiler in check mode
      - name: Run TypeScript type check
        run: npx tsc --noEmit
        # --noEmit = check types but don't produce output files
        # If any .ts file has a type error, this step fails
        # The whole job fails, the PR is blocked

  # ── JOB 2: LINT ──────────────────────────────────────────────
  # Checks code style — catches formatting issues and common bugs
  lint:
    name: ESLint code check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        # We'll add the lint script to package.json next
        continue-on-error: true
        # continue-on-error: true means lint warnings don't block the PR
        # Change to false once you've fixed all lint issues

